name: Build Windows application

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx install-electron --no
      - run: npx playwright install chromium
      - run: npm test
      - run: npm run build
      - name: Build portable Windows executable
        run: node scripts/package-windows.mjs
      - name: Smoke test the packaged Windows desktop application
        run: node scripts/smoke-desktop.mjs
        env:
          MARKNOTE_EXECUTABLE: release/win-unpacked/MarkNote.exe
      - name: Calculate SHA-256 checksum
        shell: pwsh
        run: |
          $exe = Get-Item release/MarkNote-*-Windows-x64.exe
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Set-Content -Encoding ascii release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MarkNote-Windows-x64
          path: |
            release/MarkNote-*-Windows-x64.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MarkNote-Windows-x64
          path: release
      - name: Publish Windows download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/* --title "拾光笔记 $RELEASE_TAG" --notes "Windows 10/11 x64 免安装版。下载 .exe 后双击运行。新增单词本：文章中右键单词即可查中文释义、音标并一键收藏，自动保留原句和出处。内置约 40 万词条的 ECDICT 离线英汉词典；支持词形与原形释义、搜索和去重，随笔记自动保存和备份。保留彩色粗细笔、多层标注和日夜模式。兼容旧文章，新备份请使用 v1.1.0 或更新版本打开。程序未购买商业代码签名证书。"
