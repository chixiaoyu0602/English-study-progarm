name: Build Windows application

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx install-electron --no
      - run: npx playwright install chromium
      - run: npm test
      - name: Verify offline Windows IPA speech synthesis
        run: node scripts/test-speech.mjs
      - run: npm run build
      - name: Build portable Windows executable
        run: node scripts/package-windows.mjs
      - name: Smoke test the packaged Windows desktop application
        run: node scripts/smoke-desktop.mjs
        env:
          MARKNOTE_EXECUTABLE: release/win-unpacked/MarkNote.exe
      - name: Calculate SHA-256 checksum
        shell: pwsh
        run: |
          $exe = Get-Item release/MarkNote-*-Windows-x64.exe
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Set-Content -Encoding ascii release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MarkNote-Windows-x64
          path: |
            release/MarkNote-*-Windows-x64.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MarkNote-Windows-x64
          path: release
      - name: Publish Windows download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ -f "docs/releases/$RELEASE_TAG.md" ]; then
            gh release create "$RELEASE_TAG" release/* --title "拾光笔记 $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
          else
            gh release create "$RELEASE_TAG" release/* --title "拾光笔记 $RELEASE_TAG" --generate-notes
          fi
