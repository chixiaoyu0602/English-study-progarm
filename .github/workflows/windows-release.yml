name: Build Windows application

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx install-electron --no
      - run: npx playwright install chromium
      - run: npm test
      - run: npm run build
      - name: Build portable Windows executable
        run: node scripts/package-windows.mjs
      - name: Smoke test the packaged Windows desktop application
        run: node scripts/smoke-desktop.mjs
        env:
          MARKNOTE_EXECUTABLE: release/win-unpacked/MarkNote.exe
      - name: Calculate SHA-256 checksum
        shell: pwsh
        run: |
          $exe = Get-Item release/MarkNote-*-Windows-x64.exe
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Set-Content -Encoding ascii release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MarkNote-Windows-x64
          path: |
            release/MarkNote-*-Windows-x64.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MarkNote-Windows-x64
          path: release
      - name: Publish Windows download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/* --title "拾光笔记 $RELEASE_TAG" --notes "Windows 10/11 x64 免安装版。下载 .exe 后双击运行。新增两层片段分析：主文给从句或短语涂色，点击色块打开无外层底色的文字，在框内用粗细笔分析内部成分。关闭后主文保持第一层，内部标记自动保存，不会再打开第三层。支持颜色自定义、擦除、撤销、日夜模式和备份。旧版内层标记会迁入分析框，文章和单词本保留。新备份格式为 4，请用 v1.3.0 或更新版本打开。程序未购买商业代码签名证书。"
